# CREDENTIALS.yml — ATLAS credential template. Lives on the host only (DATA_PATH/CREDENTIALS.yml, mode 600).
# - Inventories refer to an entry by TAG (CREDENTIAL: FABRIC_LOGIN). No tool ever returns a value.
# - Never paste this file, or a password, into a chat. Set values on the host:
#     atlas-interview secret <draft> <FIELD>        (or edit this file on the host and run atlas-vault encrypt)
# - Values may be plain or encrypted (ENC:v1:...). Encrypt with: atlas-vault encrypt
# - TYPE and the fields it needs ("a|b" = either):
#     LOGIN      USERNAME, LOGIN_PASSWORD|PASSWORD      (optional ENABLE_PASSWORD)
#     API_TOKEN  TOKEN|API_KEY                          (optional USERNAME)
#     SNMP       COMMUNITY (v2c)  or  USERNAME + AUTH_PASS (v3, optional PRIV_PASS)
#     CERT       CERT, PRIVATE_KEY                      (PEM text; optional PASSPHRASE)
#     SMTP       AUTH_USER, AUTH_PASS                   (HOST, FROM, PORT, TLS stay readable)
# - IS_ENABLED: false switches a tag off without deleting it.
# Every value below is a placeholder: replace CHANGE_ME before use.

DATA:
  - TAG: FABRIC_LOGIN            # used by the sample EVPN fabric (spines, leaves, service leaves)
    TYPE: LOGIN
    USERNAME: netops
    LOGIN_PASSWORD: CHANGE_ME
    ENABLE_PASSWORD: ''          # optional (IOS / IOS-XE enable)
  - TAG: SDWAN_API               # vManage / controller login
    TYPE: LOGIN
    USERNAME: apiuser
    LOGIN_PASSWORD: CHANGE_ME
  - TAG: PANOS_KEY               # PAN-OS XML API key instead of a password
    TYPE: API_TOKEN
    API_KEY: CHANGE_ME
  - TAG: SNMP_V2                 # read-only polling
    TYPE: SNMP
    COMMUNITY: CHANGE_ME
  - TAG: OOB_LOGIN               # console servers / BMCs
    TYPE: LOGIN
    USERNAME: admin
    LOGIN_PASSWORD: CHANGE_ME
    IS_ENABLED: false
