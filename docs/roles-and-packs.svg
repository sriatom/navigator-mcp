<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b73"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1f">NAVIGATOR: roles (by job) and vendor packs (by vendor)</text>

  <!-- the lead and its roles -->
  <rect x="20" y="48" width="940" height="138" rx="14" fill="#f1edfc" stroke="#6b4bc8" stroke-width="1.5"/>
  <text x="40" y="74" font-size="15" font-weight="700" fill="#1c1c1f">The lead engineer (NAVIGATOR, the front door): picks the roles, shows nothing before QC</text>
  <g font-size="12.5" fill="#1c1c1f">
    <rect x="40" y="88" width="132" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="106" y="108" text-anchor="middle">DATA_COLLECTOR</text>
    <rect x="182" y="88" width="148" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="256" y="108" text-anchor="middle">STATE_VALIDATOR</text>
    <rect x="340" y="88" width="138" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="409" y="108" text-anchor="middle">LOG_REVIEWER</text>
    <rect x="488" y="88" width="106" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="541" y="108" text-anchor="middle">ANALYZER</text>
    <rect x="604" y="88" width="168" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="688" y="108" text-anchor="middle">CONFIG_GENERATOR</text>
    <rect x="782" y="88" width="160" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="862" y="108" text-anchor="middle">CONFIG_PUSHER</text>
    <rect x="40" y="128" width="132" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="106" y="148" text-anchor="middle">DOCUMENTOR</text>
    <rect x="182" y="128" width="148" height="30" rx="8" fill="#fff" stroke="#6b4bc8"/><text x="256" y="148" text-anchor="middle">SHIP_ENGINEER</text>
    <rect x="340" y="128" width="254" height="30" rx="8" fill="#fff4e0" stroke="#9a5b00" stroke-width="1.5"/><text x="467" y="148" text-anchor="middle" font-weight="700">SANITY_AGENT (QC gate)</text>
    <rect x="604" y="128" width="168" height="30" rx="8" fill="#fff" stroke="#6b4bc8" stroke-dasharray="4 3"/><text x="688" y="148" text-anchor="middle">skill: SCRAMBLER</text>
  </g>
  <text x="782" y="148" font-size="11.5" fill="#62626a">every result passes QC first</text>
  <text x="40" y="177" font-size="11.5" fill="#62626a">e.g. "BGP is down" → STATE_VALIDATOR → LOG_REVIEWER → ANALYZER → QC   ·   "add a loopback" → CONFIG_GENERATOR → QC → CONFIG_PUSHER</text>

  <!-- the three layers -->
  <g font-size="12.5" fill="#1c1c1f">
    <rect x="20" y="206" width="300" height="178" rx="14" fill="#f1edfc" stroke="#6b4bc8" stroke-width="1.5"/>
    <text x="40" y="232" font-size="15" font-weight="700">NAVIGATOR (layer 3)</text>
    <text x="40" y="256">16 tools · projects (CLOUD / LOCAL)</text>
    <text x="40" y="276">roles, QC, lessons, scrambler, research</text>
    <text x="40" y="296">approvals: tickets, never approves</text>
    <text x="40" y="326" fill="#6b4bc8" font-weight="600">from each pack: knowledge.md</text>
    <text x="40" y="346" fill="#62626a">(verify commands, pitfalls for the roles)</text>

    <rect x="340" y="206" width="300" height="178" rx="14" fill="#e8f1fc" stroke="#0a5bb5" stroke-width="1.5"/>
    <text x="360" y="232" font-size="15" font-weight="700">RUDDER (layer 2, devices)</text>
    <text x="360" y="256">reads, change tickets, scheduler</text>
    <text x="360" y="276">approvals (Slack / Telegram), pages</text>
    <text x="360" y="296">via= per call, compare, debug</text>
    <text x="360" y="326" fill="#0a5bb5" font-weight="600">from each pack: methods + adapters</text>
    <text x="360" y="346" fill="#62626a">built-in code, or a delegated MCP server</text>

    <rect x="660" y="206" width="300" height="178" rx="14" fill="#e6f5ec" stroke="#13753a" stroke-width="1.5"/>
    <text x="680" y="232" font-size="15" font-weight="700">ATLAS (layer 1, inventory)</text>
    <text x="680" y="256">inventories, encrypted credentials</text>
    <text x="680" y="276">interview, versions, NetBox, render</text>
    <text x="680" y="296">catalogue + allowed command lists</text>
    <text x="680" y="326" fill="#13753a" font-weight="600">from each pack: platforms, commands,</text>
    <text x="680" y="346" fill="#13753a" font-weight="600">interview fields, template examples</text>
  </g>
  <path d="M170 186 V200" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- packs -->
  <rect x="20" y="404" width="940" height="176" rx="14" fill="#f5f5f7" stroke="#8b8b95" stroke-width="1.5"/>
  <text x="40" y="430" font-size="15" font-weight="700" fill="#1c1c1f">Vendor packs (navigator_packs/&lt;vendor&gt;/): one folder per vendor, plugged into all three layers</text>
  <g font-size="12" fill="#1c1c1f">
    <rect x="40" y="444" width="172" height="58" rx="9" fill="#fff" stroke="#13753a"/><text x="52" y="464" font-weight="700">arista</text><text x="52" y="482">EOS: eAPI (read+change),</text><text x="52" y="497">SSH-JSON</text>
    <rect x="222" y="444" width="214" height="58" rx="9" fill="#fff" stroke="#13753a"/><text x="234" y="464" font-weight="700">cisco</text><text x="234" y="482">IOS/XE/NX/XR/ASA: pyATS, SSH,</text><text x="234" y="497">writer · SD-WAN: API + SSH</text>
    <rect x="446" y="444" width="184" height="58" rx="9" fill="#fff" stroke="#13753a"/><text x="458" y="464" font-weight="700">paloalto</text><text x="458" y="482">PAN-OS: SSH, XML API</text><text x="458" y="497">reads + XML API changes</text>
    <rect x="640" y="444" width="146" height="58" rx="9" fill="#fff" stroke="#0a5bb5"/><text x="652" y="464" font-weight="700">fortinet</text><text x="652" y="482">FortiOS: fortinet</text><text x="652" y="497">MCP server</text>
    <rect x="796" y="444" width="146" height="58" rx="9" fill="#fff" stroke="#0a5bb5"/><text x="808" y="464" font-weight="700">multivendor</text><text x="808" y="482">11 platforms: multi-</text><text x="808" y="497">vendor MCP server</text>
    <rect x="40" y="512" width="396" height="50" rx="9" fill="#fff" stroke="#9a5b00" stroke-dasharray="5 3"/><text x="52" y="532" font-weight="700">juniper · aruba · f5 · checkpoint</text><text x="52" y="550">catalogue entries; their MCP servers are not installed yet</text>
    <rect x="446" y="512" width="496" height="50" rx="9" fill="#fff" stroke="#8b8b95"/><text x="458" y="532" font-weight="700">generic</text><text x="458" y="550">Linux and ~200 other netmiko platforms: SSH, text, no writes (fallback)</text>
  </g>
  <path d="M490 404 V390" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M170 404 V390" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M810 404 V390" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="960" y="594" text-anchor="end" font-size="10.5" fill="#8b8b95">green = built-in code · blue = delegated MCP server · dashed = not installed yet</text>
</svg>
