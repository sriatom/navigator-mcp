<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1240" height="720" fill="#ffffff"/>
  <text x="12" y="36" font-size="21" font-weight="700" fill="#1d2129">Arista EVPN Fabric: two fabrics joined by a WAN border</text>
  <text x="12" y="60" font-size="14" fill="#5b6270">22 cEOS nodes · eBGP underlay and EVPN overlay · mgmt 172.31.11.0/24 · login admin / admin</text>

  <g transform="translate(0,76)">
    <!-- regions -->
    <g fill="none" stroke-width="1.5" stroke-dasharray="6 5">
      <rect x="12" y="12" width="500" height="520" rx="10" stroke="#1d5f8a"/>
      <rect x="530" y="12" width="200" height="520" rx="10" stroke="#6d4bb3"/>
      <rect x="748" y="12" width="480" height="520" rx="10" stroke="#1f7a45"/>
    </g>
    <g font-size="13" font-weight="600">
      <text x="24" y="34" fill="#1d5f8a">PD fabric · VRF PCS · L3 VNI 30100</text>
      <text x="542" y="34" fill="#6d4bb3">WAN border · VRF WCS</text>
      <text x="760" y="34" fill="#1f7a45">QA fabric · VRF QACS · L3 VNI 30300</text>
    </g>

    <!-- links -->
    <g stroke="#6b7280" stroke-width="2" fill="none">
      <path d="M175 104 L96 230"/><path d="M175 104 L256 230"/><path d="M175 104 L416 230"/>
      <path d="M335 104 L96 230"/><path d="M335 104 L256 230"/><path d="M335 104 L416 230"/>
      <path d="M900 104 L836 230"/><path d="M900 104 L1140 230"/>
      <path d="M1070 104 L836 230"/><path d="M1070 104 L1140 230"/>
      <path d="M490 260 H556"/><path d="M704 260 H762"/>
      <path d="M96 290 V420"/><path d="M256 290 V420"/><path d="M416 290 V420"/>
      <path d="M630 290 V420"/><path d="M836 290 V420"/><path d="M1140 290 V420"/>
    </g>
    <g stroke="#B26B00" stroke-width="2" fill="none" stroke-dasharray="5 4">
      <path d="M470 420 V400 H570 V290"/>
      <path d="M782 420 V400 H690 V290"/>
    </g>
    <g font-size="12" fill="#5b6270">
      <text x="102" y="350">Po11</text><text x="102" y="365">VL11-13,22</text>
      <text x="262" y="350">Po21</text><text x="262" y="365">VL11,21,22</text>
      <text x="636" y="350">Po9</text><text x="636" y="365">Eth10</text>
      <text x="1146" y="350">Po11</text><text x="1146" y="365">VL111-113</text><text x="1146" y="380">VL122</text>
    </g>
    <g font-size="12" fill="#B26B00">
      <text x="422" y="350">Po7 inside</text><text x="422" y="365">VL3703</text>
      <text x="842" y="350">Po7 inside</text><text x="842" y="365">VL3803</text>
    </g>

    <!-- nodes: cEOS teal, firewall orange, service node grey -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="110" y="56" width="130" height="48" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="175" y="77" fill="#0a4f4f">PDSPINE1</text>
      <rect x="270" y="56" width="130" height="48" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="335" y="77" fill="#0a4f4f">PDSPINE2</text>
      <rect x="835" y="56" width="130" height="48" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="900" y="77" fill="#0a4f4f">QASPINE1</text>
      <rect x="1005" y="56" width="130" height="48" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="1070" y="77" fill="#0a4f4f">QASPINE2</text>

      <rect x="22" y="230" width="148" height="60" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="96" y="251" fill="#0a4f4f">PDLEAF1A·1B</text>
      <rect x="182" y="230" width="148" height="60" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="256" y="251" fill="#0a4f4f">PDLEAF2A·2B</text>
      <rect x="342" y="230" width="148" height="60" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="416" y="251" fill="#0a4f4f">PDSVCL1A·1B</text>
      <rect x="556" y="230" width="148" height="60" rx="10" fill="#EFEAF8" stroke="#6d4bb3" stroke-width="2"/><text x="630" y="251" fill="#45307a">WANFAB1A·1B</text>
      <rect x="762" y="230" width="148" height="60" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="836" y="251" fill="#0a4f4f">QASVCL1A·1B</text>
      <rect x="1066" y="230" width="148" height="60" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/><text x="1140" y="251" fill="#0a4f4f">QALEAF1A·1B</text>

      <rect x="22" y="420" width="148" height="48" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/><text x="96" y="441" fill="#1d2129">SERVICE1</text>
      <rect x="182" y="420" width="148" height="48" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/><text x="256" y="441" fill="#1d2129">SERVICE2</text>
      <rect x="342" y="420" width="148" height="48" rx="10" fill="#FFF3DF" stroke="#B26B00" stroke-width="2"/><text x="416" y="441" fill="#7a4900">PDFW1</text>
      <rect x="556" y="420" width="148" height="48" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/><text x="630" y="441" fill="#1d2129">SERVICE3</text>
      <rect x="762" y="420" width="148" height="48" rx="10" fill="#FFF3DF" stroke="#B26B00" stroke-width="2"/><text x="836" y="441" fill="#7a4900">QAFW1</text>
      <rect x="1066" y="420" width="148" height="48" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/><text x="1140" y="441" fill="#1d2129">SERVICE4</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <g fill="#0a4f4f">
        <text x="175" y="94">AS 65000 · .10</text><text x="335" y="94">AS 65000 · .20</text>
        <text x="900" y="94">AS 64000 · .110</text><text x="1070" y="94">AS 64000 · .120</text>
        <text x="96" y="267">AS 65100 · MLAG</text><text x="96" y="282">VTEP 10.250.10.10</text>
        <text x="256" y="267">AS 65200 · MLAG</text><text x="256" y="282">VTEP 10.250.10.20</text>
        <text x="416" y="267">AS 65300 · service</text><text x="416" y="282">VTEP 10.250.10.30</text>
        <text x="836" y="267">AS 64300 · service</text><text x="836" y="282">VTEP 10.250.10.130</text>
        <text x="1140" y="267">AS 64100 · MLAG</text><text x="1140" y="282">VTEP 10.250.10.110</text>
      </g>
      <g fill="#45307a"><text x="630" y="267">AS 64999 · gateway</text><text x="630" y="282">VTEP 10.250.10.60</text></g>
      <g fill="#5b6270">
        <text x="96" y="458">VRF A · B · C</text><text x="256" y="458">VRF A · B</text>
        <text x="630" y="458">hosts + ISP AS 12085</text><text x="1140" y="458">VRF A · B · C</text>
      </g>
      <g fill="#7a4900"><text x="416" y="458">cEOS · AS 65501</text><text x="836" y="458">cEOS · AS 64501</text></g>
    </g>

    <!-- notes -->
    <g font-size="12">
      <text x="12" y="560" fill="#B26B00">dashed: each firewall's outside (VL3702 / VL3802) is cabled to its service leafs and bridged to WANFAB over VNI 13702 / 13802</text>
      <text x="12" y="580" fill="#5b6270">service leafs to WANFAB: VL3701 10.30.60.0/27 (PD), VL3801 10.130.60.0/27 (QA) · WANFAB to SERVICE3: Po9 hosts (VL11, 61, 111), Eth10 ISP eBGP</text>
      <text x="12" y="600" fill="#5b6270">PD and QA never peer directly: WANFAB is the EVPN domain gateway · spines are the EVPN overlay hubs</text>
    </g>
  </g>
  <text x="12" y="708" font-size="11.5" fill="#8b8b95">teal = cEOS switch (pair = MLAG) · purple = WAN border · orange = firewall (cEOS router) · grey = service node (cEOS, one VRF per host)</text>
</svg>
