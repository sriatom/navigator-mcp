<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B26B00"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5FAD"/>
    </marker>
  </defs>
  <rect width="1400" height="1210" fill="#ffffff"/>

  <!-- title -->
  <text x="60" y="52" font-size="30" font-weight="700" fill="#1d2129">NAVIGATOR: one front door for network-automation agents</text>
  <text x="60" y="82" font-size="17" fill="#5b6270">The agent sees one MCP server. ATLAS (inventory) and RUDDER (devices) run inside it, behind one check. Works with any MCP host.</text>

  <!-- agents -->
  <rect x="60" y="106" width="300" height="56" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/>
  <text x="210" y="140" font-size="17" font-weight="600" fill="#1d2129" text-anchor="middle">Hermes agent</text>
  <rect x="380" y="106" width="300" height="56" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/>
  <text x="530" y="140" font-size="17" font-weight="600" fill="#1d2129" text-anchor="middle">OpenClaw, Claude or any agent</text>
  <rect x="700" y="106" width="300" height="56" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/>
  <text x="850" y="140" font-size="17" font-weight="600" fill="#1d2129" text-anchor="middle">You, in chat</text>
  <line x1="530" y1="164" x2="530" y2="206" stroke="#4a4f57" stroke-width="2" marker-end="url(#a)"/>
  <text x="542" y="192" font-size="14" fill="#4a4f57">MCP: one server, 16 tools · stdio, SSH, or HTTPS with a login (:8791)</text>
  <rect x="1050" y="106" width="290" height="88" rx="14" fill="#f3f4f6" stroke="#9aa1ad"/>
  <text x="1195" y="134" font-size="17" font-weight="700" fill="#1d2129" text-anchor="middle">Local model (Ollama)</text>
  <text x="1195" y="158" font-size="14" fill="#2b2f36" text-anchor="middle">reads LOCAL project files when</text>
  <text x="1195" y="178" font-size="14" fill="#2b2f36" text-anchor="middle">the host's model is a cloud model</text>

  <!-- NAVIGATOR: the front door -->
  <rect x="60" y="210" width="940" height="560" rx="14" fill="#EFEAFB" stroke="#6C4AB6" stroke-width="2"/>
  <text x="84" y="244" font-size="14" font-weight="700" fill="#6C4AB6">LAYER 3</text>
  <text x="160" y="246" font-size="24" font-weight="700" fill="#3b2672">NAVIGATOR: the front door and the engineer</text>
  <text x="84" y="278" font-size="15.5" fill="#2b2f36"><tspan font-weight="700" fill="#3b2672">Every call is checked first:</tspan> which project · CLOUD or LOCAL (LOCAL data never reaches</text>
  <text x="84" y="300" font-size="15.5" fill="#2b2f36">a cloud model) · the project's inventory · command allowlist · writes only as approved tickets.</text>
  <text x="84" y="330" font-size="15.5" fill="#2b2f36">9 roles: Analyzer · Config generator · Config push · Data collect · State validator · Log reviewer</text>
  <text x="84" y="352" font-size="15.5" fill="#2b2f36">· Documentor · Sanity QC · <tspan font-weight="700">Ship engineer</tspan>. Projects, scrambler, web research, troubleshooting records.</text>

  <!-- ATLAS inside -->
  <rect x="84" y="378" width="416" height="368" rx="10" fill="#E6EEF9" stroke="#1F5FAD" stroke-width="2"/>
  <text x="104" y="408" font-size="13" font-weight="700" fill="#1F5FAD">LAYER 1</text>
  <text x="104" y="434" font-size="21" font-weight="700" fill="#123b6d">ATLAS: inventory</text>
  <text x="104" y="466" font-size="14.5" fill="#2b2f36">Devices · controllers · out-of-band gear</text>
  <text x="104" y="490" font-size="14.5" fill="#2b2f36">Platform catalogue (174 platforms) with the</text>
  <text x="104" y="511" font-size="14.5" fill="#2b2f36">names netmiko, NAPALM, pyATS, Ansible use</text>
  <text x="104" y="535" font-size="14.5" fill="#2b2f36">Read-command allowlist per platform</text>
  <text x="104" y="559" font-size="14.5" fill="#2b2f36">Credential tags with an allow list per agent</text>
  <text x="104" y="583" font-size="14.5" fill="#2b2f36">Guided interview: preview → your yes → commit,</text>
  <text x="104" y="604" font-size="14.5" fill="#2b2f36">every version kept</text>
  <text x="104" y="628" font-size="14.5" fill="#2b2f36">Renders pyATS / Ansible / ANTA / multivendor</text>
  <text x="104" y="649" font-size="14.5" fill="#2b2f36">files with password references only</text>
  <text x="104" y="673" font-size="14.5" fill="#2b2f36">Exports to NetBox</text>
  <text x="104" y="726" font-size="13.5" fill="#1F5FAD" font-style="italic">No credential value ever leaves ATLAS.</text>

  <!-- RUDDER inside -->
  <rect x="520" y="378" width="456" height="368" rx="10" fill="#E3F4F4" stroke="#0F7C7C" stroke-width="2"/>
  <text x="540" y="408" font-size="13" font-weight="700" fill="#0F7C7C">LAYER 2</text>
  <text x="540" y="434" font-size="21" font-weight="700" fill="#0a4f4f">RUDDER: every device</text>
  <text x="540" y="462" font-size="14" fill="#2b2f36">Pick the connection method per call, compare two side by</text>
  <text x="540" y="482" font-size="14" fill="#2b2f36">side, raw text, debug logs. Change tickets with diff, lock,</text>
  <text x="540" y="502" font-size="14" fill="#2b2f36">rollback; scheduled changes. No AI model inside.</text>

  <rect x="540" y="518" width="416" height="96" rx="8" fill="#ffffff" stroke="#0F7C7C"/>
  <text x="556" y="542" font-size="15" font-weight="700" fill="#0a4f4f">Native adapters (our own code)</text>
  <text x="556" y="564" font-size="13.5" fill="#2b2f36">Arista eAPI + SSH (JSON) · Cisco CLI changes with rollback</text>
  <text x="556" y="584" font-size="13.5" fill="#2b2f36">Palo Alto XML API commits · SD-WAN Manager API</text>
  <text x="556" y="604" font-size="13.5" fill="#5b6270">+ read-only generic netmiko for any catalogue platform</text>

  <rect x="540" y="626" width="416" height="104" rx="8" fill="#ffffff" stroke="#0F7C7C"/>
  <text x="556" y="650" font-size="15" font-weight="700" fill="#0a4f4f">Delegated → open-source MCP servers</text>
  <text x="556" y="672" font-size="13.5" fill="#2b2f36">pyATS · multivendor · Fortinet (built)</text>
  <text x="556" y="692" font-size="13.5" fill="#2b2f36">Meraki · Catalyst Center · ACI · NSO · ISE · Panorama</text>
  <text x="556" y="712" font-size="13.5" fill="#2b2f36">F5 · Check Point · Aruba CX · gNMI (next, as needed)</text>

  <!-- internet -->
  <rect x="1050" y="210" width="290" height="132" rx="14" fill="#f3f4f6" stroke="#9aa1ad" stroke-dasharray="6 4"/>
  <text x="1195" y="244" font-size="19" font-weight="700" fill="#1d2129" text-anchor="middle">Internet</text>
  <text x="1195" y="272" font-size="15" fill="#2b2f36" text-anchor="middle">Web search via self-hosted</text>
  <text x="1195" y="293" font-size="15" fill="#2b2f36" text-anchor="middle">SearXNG (free, no API key)</text>
  <text x="1195" y="322" font-size="13.5" fill="#5b6270" text-anchor="middle">LOCAL: specific queries refused</text>
  <line x1="1002" y1="276" x2="1046" y2="276" stroke="#4a4f57" stroke-width="2" marker-end="url(#a)"/>

  <!-- approver -->
  <rect x="1050" y="362" width="290" height="214" rx="14" fill="#FFF3DF" stroke="#B26B00" stroke-width="2"/>
  <text x="1195" y="396" font-size="19" font-weight="700" fill="#7a4900" text-anchor="middle">A person approves</text>
  <text x="1195" y="426" font-size="15" fill="#2b2f36" text-anchor="middle">Gets the devices, the diff and</text>
  <text x="1195" y="447" font-size="15" fill="#2b2f36" text-anchor="middle">a one-time code, then sends</text>
  <text x="1195" y="474" font-size="17" font-weight="700" fill="#7a4900" text-anchor="middle" font-family="Consolas, monospace">/pushok CODE</text>
  <text x="1195" y="500" font-size="15" fill="#2b2f36" text-anchor="middle">on Slack, Telegram or any host,</text>
  <text x="1195" y="521" font-size="15" fill="#2b2f36" text-anchor="middle">outside the chat · page: HTTPS :8790</text>
  <text x="1195" y="551" font-size="13.5" fill="#5b6270" text-anchor="middle">No approve tool. No model can approve.</text>
  <line x1="978" y1="470" x2="1046" y2="470" stroke="#B26B00" stroke-width="2" marker-start="url(#am)" marker-end="url(#am)"/>

  <!-- atlas-link -->
  <rect x="1050" y="596" width="290" height="124" rx="14" fill="#E6EEF9" stroke="#1F5FAD" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1195" y="628" font-size="19" font-weight="700" fill="#123b6d" text-anchor="middle">atlas-link service</text>
  <text x="1195" y="656" font-size="14.5" fill="#2b2f36" text-anchor="middle">Holds the key; credentials</text>
  <text x="1195" y="677" font-size="14.5" fill="#2b2f36" text-anchor="middle">encrypted at rest (AES-256-GCM)</text>
  <text x="1195" y="702" font-size="13.5" fill="#5b6270" text-anchor="middle">one per login · recovery key (48 digits)</text>
  <line x1="1046" y1="658" x2="980" y2="658" stroke="#1F5FAD" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ab)"/>
  <!-- network -->
  <path d="M760,748 C760,790 900,800 1046,806" fill="none" stroke="#4a4f57" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1050" y="742" width="290" height="112" rx="14" fill="#f3f4f6" stroke="#9aa1ad"/>
  <text x="1195" y="776" font-size="19" font-weight="700" fill="#1d2129" text-anchor="middle">Your network</text>
  <text x="1195" y="804" font-size="15" fill="#2b2f36" text-anchor="middle">Switches, routers, firewalls,</text>
  <text x="1195" y="825" font-size="15" fill="#2b2f36" text-anchor="middle">controllers, console servers</text>

  <text x="84" y="806" font-size="14.5" fill="#1F5FAD" font-weight="600">Credentials go from atlas-link to RUDDER only, never through NAVIGATOR's replies or a model.</text>
  <text x="84" y="830" font-size="14.5" fill="#0a4f4f">Every command output is saved to the project's records. A read never changes a device.</text>

  <!-- rules -->
  <rect x="60" y="874" width="1280" height="160" rx="12" fill="#fafafa" stroke="#d5d9df"/>
  <text x="84" y="904" font-size="16" font-weight="700" fill="#1d2129">The rules</text>
  <text xml:space="preserve" x="84" y="932" font-size="15" fill="#2b2f36">1. The agent talks to NAVIGATOR only; each layer calls only the one below it.    2. Passwords never reach a model.</text>
  <text xml:space="preserve" x="84" y="958" font-size="15" fill="#2b2f36">3. ATLAS and RUDDER are plain Python: no AI model inside.    4. Every device change is a ticket a person approves with <tspan font-family="Consolas, monospace" font-weight="700">/pushok</tspan> outside the chat.</text>
  <text xml:space="preserve" x="84" y="984" font-size="15" fill="#2b2f36">5. A read never changes a device, including through the libraries underneath.    6. Works with any MCP host, no host-specific code.</text>
  <text x="84" y="1014" font-size="13" fill="#5b6270">Existing MCP servers keep doing what they do best; NAVIGATOR and RUDDER put one check, one approval path and one record format in front of all of them.</text>

  <!-- running it -->
  <text x="60" y="1074" font-size="16" font-weight="700" fill="#1d2129">Running it: one shell command, navigator-setup (never a chat tool)</text>
  <rect x="60" y="1090" width="305" height="96" rx="10" fill="#f3f4f6" stroke="#9aa1ad"/>
  <text x="78" y="1116" font-size="15" font-weight="700" fill="#1d2129">HTTPS with logins</text>
  <text x="78" y="1140" font-size="13.5" fill="#2b2f36">8791 / 8792 / 8793, a local CA</text>
  <text x="78" y="1161" font-size="13.5" fill="#2b2f36">users admin or engineer, random passwords</text>
  <rect x="385" y="1090" width="305" height="96" rx="10" fill="#FFF3DF" stroke="#B26B00"/>
  <text x="403" y="1116" font-size="15" font-weight="700" fill="#7a4900">Approvals and change pages</text>
  <text x="403" y="1140" font-size="13.5" fill="#2b2f36">Hermes approval bot, or rudder-approve</text>
  <text x="403" y="1161" font-size="13.5" fill="#2b2f36">for any host · pages kept 90 days</text>
  <rect x="710" y="1090" width="305" height="96" rx="10" fill="#E6EEF9" stroke="#1F5FAD"/>
  <text x="728" y="1116" font-size="15" font-weight="700" fill="#123b6d">Recovery key and backups</text>
  <text x="728" y="1140" font-size="13.5" fill="#2b2f36">one encrypted file; restore with it and</text>
  <text x="728" y="1161" font-size="13.5" fill="#2b2f36">the recovery key, also on a new host</text>
  <rect x="1035" y="1090" width="305" height="96" rx="10" fill="#EFEAFB" stroke="#6C4AB6"/>
  <text x="1053" y="1116" font-size="15" font-weight="700" fill="#3b2672">10 vendor packs</text>
  <text x="1053" y="1140" font-size="13.5" fill="#2b2f36">Arista · Cisco · Palo Alto · Fortinet …</text>
  <text x="1053" y="1161" font-size="13.5" fill="#2b2f36">+ the generic netmiko fallback</text>
</svg>
