# SearXNG for NAVIGATOR `research` and Hermes `web_search`. Local only: 127.0.0.1:8888.
# Install: scripts/install_searxng.sh (copies this to ~/searxng and starts it). See docs/SEARXNG.md.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "1"}
