# Publish navigator-mcp to PyPI when a version tag (v0.3.0, ...) is pushed to this repo.
# PyPI trusts this workflow directly ("trusted publisher"): no token or password is stored anywhere.
# Source: the private repo's publish/github/release.yml, copied here by scripts/publish_public.py.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject version $v"; exit 1; }
      - name: Tests
        run: |
          python -m pip install -q ".[test]"
          python -m pytest -q -p no:warnings
      - name: Build
        run: |
          python -m pip install -q build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/navigator-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
